name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vX.Y.Z-xxx, for example v1.2.3-rc1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases can only be created from main (selected ref: $GITHUB_REF)." >&2
          exit 1

      - name: Validate version and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "Invalid version '$VERSION'. Expected vX.Y.Z-xxx, for example v1.2.3-rc1." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag '$VERSION' already exists." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="dch-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$archive"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/$archive/dch" .
          cp README.md "dist/$archive/README.md"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: dch-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create tag and GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dch-${{ inputs.version }}-*
          merge-multiple: true

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" dist/*.tar.gz \
            --title "$VERSION" \
            --generate-notes
