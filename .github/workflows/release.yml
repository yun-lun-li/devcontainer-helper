name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and main ancestry
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "Invalid version '$VERSION'. Expected vX.Y.Z-xxx, for example v1.2.3-rc1." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag '$VERSION' does not point to a commit contained in main." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="dch-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$archive"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/$archive/dch" .
          cp README.md "dist/$archive/README.md"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: dch-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release binaries
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source and annotation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dch-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Create release from tag annotation and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-from-tag dist/*.tar.gz
